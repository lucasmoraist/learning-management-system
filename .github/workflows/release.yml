name: Create Release on Commit to Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configura o ambiente Java 21 (JDK do seu projeto)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Dá permissão de execução para o Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Executa os testes automatizados para garantir a integridade da release
      - name: Run automated tests
        run: ./gradlew test

      # 5. Compila o projeto e gera o arquivo .jar executável
      - name: Build production JAR
        run: ./gradlew bootJar

      # 6. Extrai a versão dinamicamente de dentro do gradle.properties
      - name: Extract version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep 'version=' gradle.properties | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Project version is $VERSION"

      # 7. Cria a Tag do Git de forma automática usando a versão encontrada
      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Se a tag com essa versão já existir localmente/remotamente, adiciona o hash do commit curto para evitar conflito
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v${{ env.VERSION }}-${SHORT_SHA}"
          
          git tag $TAG_NAME
          git push origin $TAG_NAME
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      # 8. Cria a Release oficial no GitHub e faz o upload do artefato .jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            Automated Release generated from commit: ${{ github.sha }}
            
            ### 📦 Artifacts
            The compiled executable artifact for this version is attached below.
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}