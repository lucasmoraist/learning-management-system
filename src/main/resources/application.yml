spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: learning-management-system
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: ${FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    accessKey: ${AWS_S3_ACCESS_KEY:minioadmin}
    secretKey: ${AWS_S3_SECRET_KEY:minioadmin}
    bucketName: ${AWS_S3_BUCKET_NAME:lms-bucket}
    region: us-east-1